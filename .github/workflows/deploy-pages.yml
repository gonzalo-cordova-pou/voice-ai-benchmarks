name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # Daily at 08:23 UTC, away from the top-of-hour Actions rush.
    - cron: '23 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test ranking
        run: npm test
      - name: Restore previous benchmark stats
        id: stats-cache
        uses: actions/cache/restore@v5
        with:
          path: data/benchmark-stats.json
          key: benchmark-stats-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            benchmark-stats-v1-
      - name: Refresh benchmark stats
        run: npm run stats:refresh
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build
        run: npm run build
      - name: Save benchmark stats for the next refresh
        uses: actions/cache/save@v5
        with:
          path: data/benchmark-stats.json
          key: ${{ steps.stats-cache.outputs.cache-primary-key }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
